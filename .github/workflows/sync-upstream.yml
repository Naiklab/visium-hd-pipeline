name: Sync from upstream

on:
  schedule:
    - cron: "15 */6 * * *"   # every 6 hours
  workflow_dispatch:          # allows manual runs from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork with IkjotSidhu/visium-hd-pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh repo sync ${{ github.repository }} --source IkjotSidhu/visium-hd-pipeline --branch main
